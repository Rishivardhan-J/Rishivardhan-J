span></text><text x="64" y="244" font-family="Fira Code, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#334155"> 7&#160;&#160;</tspan><tspan>&#160;&#160;</tspan><tspan fill="#22D3EE">charting</tspan><tspan fill="#8B9BB4">:</tspan><tspan>&#160;</tspan><tspan fill="#8B9BB4">[</tspan><tspan fill="#F472B6">&quot;DevOps&quot;</tspan><tspan fill="#8B9BB4">,</tspan><tspan>&#160;</tspan><tspan fill="#F472B6">&quot;System&#160;Design&quot;</tspan><tspan fill="#8B9BB4">],</tspan></text><text x="64" y="267" font-family="Fira Code, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#334155"> 8&#160;&#160;</tspan><tspan>&#160;&#160;</tspan><tspan fill="#22D3EE">motto</tspan><tspan fill="#8B9BB4">:</tspan><tspan>&#160;</tspan><tspan fill="#F472B6">&quot;Learn&#160;by&#160;building.&quot;</tspan><tspan fill="#8B9BB4">,</tspan></text><text x="64" y="290" font-family="Fira Code, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#334155"> 9&#160;&#160;</tspan><tspan fill="#8B9BB4">};</tspan></text><text x="64" y="319" font-family="Fira Code, Consolas, monospace" font-size="15" fill="#22D3EE">&gt; <tspan fill="#8B9BB4">ready for the next mission</tspan></text><rect x="326" y="307" width="9" height="18" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect><rect x="720" y="36" width="440" height="300" rx="14" fill="#F472B6" fill-opacity=".05" stroke="#F472B6" stroke-opacity=".4"/><text x="744" y="72" font-family="Fira Code, Consolas, monospace" font-size="12" letter-spacing="4" fill="#F472B6">// ABOUT</text><text x="744" y="104" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E2E8F0">I&#x27;m a Computer Science student who</text><text x="744" y="126" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E2E8F0">turns ideas into working products:</text><text x="744" y="148" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E