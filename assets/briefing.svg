" font-size="14" fill="#E6EAF2">I&#x27;m a Computer Science student who</text><text x="744" y="126" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E6EAF2">turns ideas into working products:</text><text x="744" y="148" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E6EAF2">web apps, mobile apps and ML-backed</text><text x="744" y="170" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E6EAF2">tools.</text><text x="744" y="192" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E6EAF2"></text><text x="744" y="214" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E6EAF2">I pick up problems people actually</text><text x="744" y="236" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E6EAF2">face and ship something that solves</text><text x="744" y="258" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#E6EAF2">them, not just tutorials.</text><rect x="744" y="290" width="112" height="28" rx="14" fill="#8FB8F0" fill-opacity=".14" stroke="#8FB8F0" stroke-opacity=".7"/><text x="800.0" y="309" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700" fill="#8FB8F0">FULL STACK</text><rect x="864" y="290" width="76" height="28" rx="14" fill="#8FB8F0" fill-opacity=".14" stroke="#8FB8F0" stroke-opacity=".7"/><text x="902.0" y="309" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700" fill="#8FB8F0">MOBILE</text><rect x="948" y="290" width="40" height="28" rx="14" fill="#8FB8F0" fill-opacity=".14" stroke="#8FB8F0" stroke-opacity=".7"/><text x="968.0" y="309" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="11" font-weight="700" fill="#8FB8F0">ML</text><rect x="996" y="290" width="76" height="28" rx="14" fill="#8FB8F0" fill-opacity=".14" stroke="#8FB8F0" stroke-opacity=".7"/><text x="1034.0" y="309" text-anchor="middle" font-family="Fira Code, C