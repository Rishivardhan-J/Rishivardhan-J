name: Update Profile Visuals

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate raw contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rishivardhan-J
          outputs: |
            dist/snake-raw.svg?color_snake=#E6C07B&color_dots=#182133,#2B4266,#4A70A8,#8FB8F0,#D6E5FB

      - name: Generate stats dashboard and flight deck SVGs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 scripts/build_stats.py dist/github-stats.svg dist/github-flight.svg

      - name: Compose Orbit Log and Transmission panels
        run: |
          python3 scripts/build_closing.py dist/snake-raw.svg dist/orbit-data.json dist
          rm dist/snake-raw.svg dist/orbit-data.json

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
