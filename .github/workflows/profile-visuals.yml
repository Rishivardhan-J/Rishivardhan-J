name: Update Profile Visuals

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rishivardhan-J
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8A6116&color_dots=#E6EAF2,#C4DAF8,#8FB8F0,#5B82C2,#2F4F85
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E6C07B&color_dots=#182133,#2B4266,#4A70A8,#8FB8F0,#D6E5FB

      - name: Generate stats dashboard SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 scripts/build_stats.py dist/github-stats.svg dist/github-flight.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
