name: Update Profile Visuals

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rishivardhan-J
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F472B6&color_dots=#ebedf0,#cffafe,#67e8f9,#8B5CF6,#5b21b6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#161B33,#0e3a4a,#0e7490,#22D3EE,#8B5CF6

      - name: Generate stats dashboard SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 scripts/build_stats.py dist/github-stats.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
